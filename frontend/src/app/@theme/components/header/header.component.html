<div class="header-container">
  <div class="logo-container">
    <a (click)="toggleSidebar()" href="#" class="sidebar-toggle">
      <nb-icon icon="menu-2-outline"></nb-icon>
    </a>
    <a class="logo" href="#" (click)="navigateHome()">{{ storeName || ('MENU.POS' | translate) }}</a>
  </div>
</div>

<div class="header-container">
  <nb-actions size="small">
    <nb-action class="currency-action">
      <nb-select [(ngModel)]="currentCurrency" (ngModelChange)="onCurrencyChange($event)" size="small" status="primary">
        <nb-option *ngFor="let currency of supportedCurrencies" [value]="currency.code">
          {{ currency.symbol }} {{ currency.code }}
        </nb-option>
      </nb-select>
    </nb-action>
    <nb-action class="user-action" *nbIsGranted="['view', 'user']">
      <nb-user [nbContextMenu]="userMenu" nbContextMenuTag="user-menu"
               [onlyPicture]="userPictureOnly"
               [name]="user?.name ?? ('HEADER.DEFAULT_USER' | translate)">
      </nb-user>
    </nb-action>
  </nb-actions>
</div>
